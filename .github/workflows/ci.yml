name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Slide markers are speaker-facing only, so drift is invisible in the
      # rendered deck — check them before the build.
      - run: bun run check:pages

      - run: bun run typecheck

      - run: bun run build

      # check:styles drives a real browser over the built deck, so the browser
      # has to be present. It runs after build because it serves dist/.
      - run: bunx playwright install --with-deps chromium

      - run: bun run check:styles
